<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contacts - Boutique Broadcast</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav id="nav"></nav>
  <div class="mode-banner" id="mode-banner"></div>
  <main>
    <h1>Contacts</h1>

    <div class="card">
      <h2>Add a contact</h2>
      <form class="inline" id="addForm">
        <div>
          <label>Phone (e.g. +15551234567)</label>
          <input name="phone" required />
        </div>
        <div>
          <label>Name</label>
          <input name="name" />
        </div>
        <div>
          <label><input type="checkbox" name="skip" style="width:auto" /> Skip (don't message this contact)</label>
        </div>
        <button type="submit">Add</button>
      </form>
      <div class="error" id="addError"></div>
    </div>

    <div class="card">
      <h2>Import from CSV</h2>
      <p class="muted">Paste CSV with header row: <code>phone,name,skip</code>. Everyone is messageable by default -- mark <code>skip=true</code> to exclude someone.</p>
      <form id="importForm">
        <textarea name="csv" placeholder="phone,name,skip&#10;+15551234567,Alice,false"></textarea><br /><br />
        <button type="submit">Import</button>
      </form>
      <div class="error" id="importError"></div>
      <div class="muted" id="importResult"></div>
    </div>

    <div class="card">
      <h2>All contacts</h2>
      <table>
        <thead><tr><th>Phone</th><th>Name</th><th>Status</th><th>Source</th><th></th></tr></thead>
        <tbody id="contactsBody"></tbody>
      </table>
    </div>
  </main>
  <script src="app.js"></script>
  <script>
    async function loadContacts() {
      const contacts = await api('/contacts');
      document.getElementById('contactsBody').innerHTML = contacts
        .map(
          (c) => `<tr>
            <td>${escapeHtml(c.phone)}</td>
            <td>${escapeHtml(c.name || '')}</td>
            <td><span class="badge ${c.opt_in_status}">${c.opt_in_status}</span></td>
            <td class="muted">${escapeHtml(c.opt_in_source || '')}</td>
            <td><button class="danger deleteBtn" data-id="${c.id}" data-phone="${escapeHtml(c.phone)}">Delete</button></td>
          </tr>`
        )
        .join('');
      document.querySelectorAll('.deleteBtn').forEach((btn) => {
        btn.onclick = async () => {
          if (!confirm(`Delete ${btn.dataset.phone}? This also removes their send history and cannot be undone.`)) return;
          try {
            await api(`/contacts/${btn.dataset.id}`, { method: 'DELETE' });
            await loadContacts();
          } catch (err) {
            alert('Error: ' + err.message);
          }
        };
      });
    }

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const errorEl = document.getElementById('addError');
      errorEl.textContent = '';
      try {
        await api('/contacts', {
          method: 'POST',
          body: JSON.stringify({
            phone: form.phone.value.trim(),
            name: form.name.value.trim() || undefined,
            skip: form.skip.checked,
          }),
        });
        form.reset();
        await loadContacts();
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });

    document.getElementById('importForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('importError');
      const resultEl = document.getElementById('importResult');
      errorEl.textContent = '';
      resultEl.textContent = '';
      try {
        const res = await fetch('/contacts/import', {
          method: 'POST',
          headers: { 'Content-Type': 'text/csv' },
          body: e.target.csv.value,
        });
        if (res.status === 401) return (window.location.href = '/login.html');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        resultEl.textContent = `Inserted: ${data.inserted}, Updated: ${data.updated}, Skipped: ${data.skipped.length}`;
        await loadContacts();
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });

    (async () => {
      await renderNav('contacts.html');
      await loadContacts();
    })();
  </script>
</body>
</html>
