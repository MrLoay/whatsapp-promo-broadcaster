<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Campaigns - Boutique Broadcast</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav id="nav"></nav>
  <div class="mode-banner" id="mode-banner"></div>
  <main>
    <h1>Campaigns</h1>

    <div class="card">
      <h2>New campaign</h2>
      <form id="createForm">
        <label>Name</label>
        <input name="name" required style="width:100%; margin-bottom:10px;" />
        <label>Template</label>
        <select name="templateId" id="templateSelect" required style="width:100%; margin-bottom:10px;"></select>
        <div id="variableInputs"></div>
        <button type="submit">Create campaign (draft)</button>
      </form>
      <div class="error" id="createError"></div>
    </div>

    <div class="card">
      <h2>All campaigns</h2>
      <table>
        <thead>
          <tr><th>Name</th><th>Template</th><th>Status</th><th>Sent</th><th>Delivered</th><th>Read</th><th>Failed</th><th></th></tr>
        </thead>
        <tbody id="campaignsBody"></tbody>
      </table>
    </div>
  </main>
  <script src="app.js"></script>
  <script>
    let templates = [];

    function renderVariableInputs() {
      const templateId = Number(document.getElementById('templateSelect').value);
      const template = templates.find((t) => t.id === templateId);
      const container = document.getElementById('variableInputs');
      if (!template || template.variable_count === 0) {
        container.innerHTML = '';
        return;
      }
      container.innerHTML =
        `<p class="muted">This template needs ${template.variable_count} variable(s), in order:</p>` +
        Array.from({ length: template.variable_count })
          .map((_, i) => `<input class="varInput" placeholder="{{${i + 1}}} value" style="margin:0 6px 10px 0;" />`)
          .join('');
    }

    async function loadTemplatesIntoSelect() {
      templates = await api('/templates');
      const select = document.getElementById('templateSelect');
      select.innerHTML = templates.map((t) => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('');
      select.onchange = renderVariableInputs;
      renderVariableInputs();
    }

    async function loadCampaigns() {
      const campaigns = await api('/campaigns');
      document.getElementById('campaignsBody').innerHTML = campaigns
        .map(
          (c) => `<tr>
            <td><a class="link" href="campaign.html?id=${c.id}">${escapeHtml(c.name)}</a></td>
            <td class="muted">${escapeHtml(c.template_name || '')}</td>
            <td><span class="badge ${c.status}">${c.status}</span></td>
            <td>${c.sent || 0}</td>
            <td>${c.delivered || 0}</td>
            <td>${c.read || 0}</td>
            <td>${c.failed || 0}</td>
            <td><button data-id="${c.id}" class="sendBtn">Send</button></td>
          </tr>`
        )
        .join('');
      document.querySelectorAll('.sendBtn').forEach((btn) => {
        btn.onclick = async () => {
          const id = btn.dataset.id;
          if (!confirm(`Send this campaign now to all opted-in contacts not yet successfully messaged?\n\nThis sends REAL messages if the system isn't in dry-run mode.`)) return;
          btn.disabled = true;
          btn.textContent = 'Sending...';
          try {
            const summary = await api(`/campaigns/${id}/send`, { method: 'POST' });
            alert(`Targeted: ${summary.totalTargeted}, Sent: ${summary.sent}, Failed: ${summary.failed}, Throttled: ${summary.throttledOut}`);
          } catch (err) {
            alert('Error: ' + err.message);
          }
          await loadCampaigns();
        };
      });
    }

    document.getElementById('createForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const errorEl = document.getElementById('createError');
      errorEl.textContent = '';
      const variableValues = Array.from(document.querySelectorAll('.varInput')).map((i) => i.value);
      try {
        await api('/campaigns', {
          method: 'POST',
          body: JSON.stringify({
            name: form.name.value.trim(),
            templateId: Number(form.templateId.value),
            variableValues,
          }),
        });
        form.reset();
        await loadTemplatesIntoSelect();
        await loadCampaigns();
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });

    (async () => {
      await renderNav('campaigns.html');
      await loadTemplatesIntoSelect();
      await loadCampaigns();
    })();
  </script>
</body>
</html>
