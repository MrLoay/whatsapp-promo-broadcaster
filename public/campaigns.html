<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Campaigns - Boutique Broadcast</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav id="nav"></nav>
  <div class="mode-banner" id="mode-banner"></div>
  <main>
    <h1>Campaigns</h1>

    <div class="card">
      <h2>New campaign</h2>
      <form id="createForm">
        <label>Name</label>
        <input name="name" required style="width:100%; margin-bottom:10px;" />
        <label>Message</label>
        <textarea name="message" required placeholder="Hi {{name}}, enjoy 20% off this week! Reply STOP to unsubscribe."></textarea>
        <p class="muted">Use <code>{{name}}</code> anywhere and each contact's own name is filled in automatically.</p>
        <button type="submit">Create campaign (draft)</button>
      </form>
      <div class="error" id="createError"></div>
    </div>

    <div class="card">
      <h2>All campaigns</h2>
      <table>
        <thead>
          <tr><th>Name</th><th>Status</th><th>Sent</th><th>Delivered</th><th>Read</th><th>Failed</th><th></th></tr>
        </thead>
        <tbody id="campaignsBody"></tbody>
      </table>
    </div>
  </main>
  <script src="app.js"></script>
  <script>
    async function loadCampaigns() {
      const campaigns = await api('/campaigns');
      document.getElementById('campaignsBody').innerHTML = campaigns
        .map(
          (c) => `<tr>
            <td><a class="link" href="campaign.html?id=${c.id}">${escapeHtml(c.name)}</a></td>
            <td><span class="badge ${c.status}">${c.status}</span></td>
            <td>${c.sent || 0}</td>
            <td>${c.delivered || 0}</td>
            <td>${c.read || 0}</td>
            <td>${c.failed || 0}</td>
            <td><button data-id="${c.id}" class="sendBtn">Send</button></td>
          </tr>`
        )
        .join('');
      document.querySelectorAll('.sendBtn').forEach((btn) => {
        btn.onclick = async () => {
          const id = btn.dataset.id;
          if (!confirm(`Send this campaign now to all opted-in contacts not yet successfully messaged?\n\nThis sends REAL messages if the system isn't in dry-run mode.`)) return;
          btn.disabled = true;
          btn.textContent = 'Sending...';
          try {
            const summary = await api(`/campaigns/${id}/send`, { method: 'POST' });
            alert(`Targeted: ${summary.totalTargeted}, Sent: ${summary.sent}, Failed: ${summary.failed}, Throttled: ${summary.throttledOut}`);
          } catch (err) {
            alert('Error: ' + err.message);
          }
          await loadCampaigns();
        };
      });
    }

    document.getElementById('createForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const errorEl = document.getElementById('createError');
      errorEl.textContent = '';
      try {
        await api('/campaigns/quick', {
          method: 'POST',
          body: JSON.stringify({ name: form.name.value.trim(), message: form.message.value.trim() }),
        });
        form.reset();
        await loadCampaigns();
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });

    (async () => {
      await renderNav('campaigns.html');
      await loadCampaigns();
    })();
  </script>
</body>
</html>
