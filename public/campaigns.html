<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Campaigns - Boutique Broadcast</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav id="nav"></nav>
  <div class="mode-banner" id="mode-banner"></div>
  <main>
    <h1>Campaigns</h1>
    <p class="muted">To send a new broadcast, use <a class="link" href="index.html">Send a message now</a> on the Home page. This page tracks what's already gone out.</p>

    <div class="card">
      <table>
        <thead>
          <tr><th>Name</th><th>Status</th><th>Sent</th><th>Delivered</th><th>Read</th><th>Failed</th><th></th></tr>
        </thead>
        <tbody id="campaignsBody"></tbody>
      </table>
    </div>
  </main>
  <script src="app.js"></script>
  <script>
    async function loadCampaigns() {
      const campaigns = await api('/campaigns');
      document.getElementById('campaignsBody').innerHTML = campaigns
        .map(
          (c) => `<tr>
            <td><a class="link" href="campaign.html?id=${c.id}">${escapeHtml(c.name)}</a></td>
            <td><span class="badge ${c.status}">${c.status}</span></td>
            <td>${c.sent || 0}</td>
            <td>${c.delivered || 0}</td>
            <td>${c.read || 0}</td>
            <td>${c.failed || 0}</td>
            <td>${c.failed > 0 ? `<button data-id="${c.id}" class="sendBtn">Retry failed</button>` : ''}</td>
          </tr>`
        )
        .join('');
      document.querySelectorAll('.sendBtn').forEach((btn) => {
        btn.onclick = async () => {
          const id = btn.dataset.id;
          if (!confirm(`Retry the ${btn.closest('tr').children[5].textContent} failed recipient(s) for this campaign?\n\nOnly do this if they genuinely didn't receive it -- some failures are false alarms (see the campaign detail page).`)) return;
          btn.disabled = true;
          btn.textContent = 'Sending...';
          try {
            const summary = await api(`/campaigns/${id}/send`, { method: 'POST' });
            alert(`Targeted: ${summary.totalTargeted}, Sent: ${summary.sent}, Failed: ${summary.failed}, Throttled: ${summary.throttledOut}`);
          } catch (err) {
            alert('Error: ' + err.message);
          }
          await loadCampaigns();
        };
      });
    }

    (async () => {
      await renderNav('campaigns.html');
      await loadCampaigns();
    })();
  </script>
</body>
</html>
