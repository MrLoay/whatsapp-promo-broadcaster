<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Boutique Broadcast</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <div style="display: flex; justify-content: flex-end; margin-bottom: 12px;">
        <select id="loginLangSelect" style="font-size: 12px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text);">
          <option value="en">EN</option>
          <option value="ms">Bahasa Melayu</option>
          <option value="zh">中文</option>
        </select>
      </div>
      <h1 data-i18n="login.heading">Boutique Broadcast</h1>
      <form id="loginForm">
        <label for="username" data-i18n="login.username">Username</label>
        <input id="username" name="username" autocomplete="username" style="width:100%; margin-bottom:12px;" required />
        <label for="password" data-i18n="login.password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" style="width:100%; margin-bottom:16px;" required />
        <button type="submit" style="width:100%;" data-i18n="login.button">Log in</button>
        <div class="error" id="error"></div>
      </form>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script>
    const loginLangSelect = document.getElementById('loginLangSelect');
    if (loginLangSelect) {
      loginLangSelect.value = getLang();
      loginLangSelect.onchange = (e) => {
        setLang(e.target.value);
        applyTranslations();
      };
    }
    applyTranslations();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';
      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || 'Login failed');
        }
        window.location.href = '/index.html';
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });
  </script>
</body>
</html>
