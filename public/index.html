<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard - Boutique Broadcast</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav id="nav"></nav>
  <div class="mode-banner" id="mode-banner"></div>
  <main>
    <h1 data-i18n="home.heading">Overview</h1>
    <div class="stat-row" id="stats"></div>

    <div class="card" style="margin-top:20px;">
      <h2 data-i18n="home.send.heading">Send a message now</h2>
      <p class="muted" data-i18n="home.send.desc">Sends to every contact right away -- no draft, no review step. Use <code>{{name}}</code> to fill in each contact's own name automatically.</p>
      
      <form id="sendNowForm">
        <div style="margin-bottom: 16px;">
          <label for="accountSelect">Target Sending Account / Proxy</label>
          <select id="accountSelect" name="account" style="width: 100%; max-width: 400px;">
            <option value="all">All Active Accounts (Round-Robin)</option>
          </select>
        </div>

        <div style="margin-bottom: 16px;">
          <label for="delaySelect" style="font-weight: 600; display: block; margin-bottom: 4px;">Sending Speed / Delay Mode:</label>
          <select id="delaySelect" name="delayMode" style="width: 100%; max-width: 400px; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
            <option value="auto">Automatic (Fast - System Managed)</option>
            <option value="old_acc">Old Account Mode (2 to 5 min delay per msg)</option>
            <option value="moderate">Moderate Safe Mode (10 to 30 sec delay per msg)</option>
            <option value="custom">Custom Fixed Delay (seconds)</option>
          </select>
        </div>

        <div id="customDelayContainer" style="display: none; margin-bottom: 16px;">
          <label for="customDelayInput" style="font-weight: 600; display: block; margin-bottom: 4px;">Custom Delay (seconds):</label>
          <input type="number" id="customDelayInput" name="customDelay" min="1" max="600" value="120" style="width: 100%; max-width: 200px; padding: 8px;" />
        </div>

        <div style="margin-bottom: 16px;">
          <label for="mediaInput" style="font-weight: 600; display: block; margin-bottom: 4px;">Attach Image or Video (Optional):</label>
          <input type="file" id="mediaInput" name="media" accept="image/*,video/*" style="width: 100%; max-width: 400px;" />
        </div>

        <textarea name="message" required data-i18n-placeholder="home.send.placeholder" placeholder="Hi {{name}}, enjoy 20% off this week!"></textarea><br /><br />
        <button type="submit" data-i18n="home.send.button">Send to all contacts</button>
      </form>
      <div class="error" id="sendNowError"></div>
      <div class="muted" id="sendNowResult" style="margin-top: 10px;"></div>
    </div>
  </main>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
  <script>
    let globalContacts = [];
    let globalCampaigns = [];
    let globalAccounts = [];

    async function loadAccountsDropdown() {
      try {
        globalAccounts = await api('/accounts');
        const select = document.getElementById('accountSelect');
        select.innerHTML = '<option value="all">All Active Accounts (Round-Robin)</option>';
        globalAccounts.forEach((acc) => {
          const opt = document.createElement('option');
          opt.value = acc.id;
          opt.textContent = `${acc.account_name || acc.id} (${acc.status})`;
          select.appendChild(opt);
        });
      } catch (err) {
        console.warn('Failed to load accounts list', err);
      }
    }

    let globalCredits = 0;

    async function loadStats() {
      const [contacts, campaigns, creditsRes] = await Promise.all([
        api('/contacts'), 
        api('/campaigns'),
        api('/credits')
      ]);
      globalContacts = contacts;
      globalCampaigns = campaigns;
      globalCredits = creditsRes.balance || 0;
      updateMetricsDisplay();
    }

    function updateMetricsDisplay() {
      const selectedAccount = document.getElementById('accountSelect').value;
      let targetContacts = globalContacts;

      const totalContacts = targetContacts.length;
      const optedIn = targetContacts.filter((c) => c.opt_in_status === 'opted_in').length;
      const optedOut = targetContacts.filter((c) => c.opt_in_status === 'opted_out').length;

      let totalSentCount = 0;
      globalCampaigns.forEach((c) => {
        totalSentCount += (c.sent || 0) + (c.delivered || 0) + (c.read || 0);
      });

      const stats = [
        ['Available Credits', new Intl.NumberFormat().format(globalCredits)],
        [t('home.stat.contacts'), totalContacts],
        [t('home.stat.optedIn'), optedIn],
        [t('home.stat.optedOut'), optedOut],
        [t('home.stat.campaigns'), totalSentCount],
      ];

      document.getElementById('stats').innerHTML = stats
        .map(([label, n]) => `<div class="stat"><div class="n">${n}</div><div class="label">${label}</div></div>`)
        .join('');
    }

    document.getElementById('accountSelect').addEventListener('change', updateMetricsDisplay);

    document.getElementById('delaySelect').addEventListener('change', (e) => {
      const customContainer = document.getElementById('customDelayContainer');
      customContainer.style.display = e.target.value === 'custom' ? 'block' : 'none';
    });

    document.getElementById('sendNowForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const errorEl = document.getElementById('sendNowError');
      const resultEl = document.getElementById('sendNowResult');
      errorEl.textContent = '';
      resultEl.textContent = '';

      const optedIn = globalContacts.filter((c) => c.opt_in_status === 'opted_in').length;
      const selectedAccount = document.getElementById('accountSelect').value;
      const accountLabel = selectedAccount === 'all' ? 'All Active Accounts' : selectedAccount;
      const delayMode = form.delayMode.value;
      const customDelay = Number(form.customDelay.value || 120);

      if (!confirm(`${t('home.send.confirmPrefix')} ${optedIn} ${t('home.send.confirmSuffix')}\n(Using ${accountLabel}, Delay: ${delayMode})`)) return;

      const btn = form.querySelector('button');
      const originalLabel = btn.textContent;
      btn.disabled = true;
      btn.textContent = t('home.send.sending');
      try {
        const formData = new FormData();
        formData.append('message', form.message.value);
        formData.append('accountId', selectedAccount);
        formData.append('delayMode', delayMode);
        formData.append('customDelay', customDelay);
        if (form.media.files[0]) {
          formData.append('media', form.media.files[0]);
        }

        const summary = await api('/campaigns/send-now', {
          method: 'POST',
          body: formData
        });
        resultEl.textContent = `Targeted: ${summary.totalTargeted}, Sent: ${summary.sent}, Failed: ${summary.failed}, Throttled: ${summary.throttledOut}`;
        form.reset();
        await loadStats();
      } catch (err) {
        errorEl.textContent = err.message;
      }
      btn.disabled = false;
      btn.textContent = originalLabel;
    });
    // --- Draft Persistence Logic ---
    function saveDraft() {
      const form = document.getElementById('sendNowForm');
      localStorage.setItem('draft_account', form.account.value);
      localStorage.setItem('draft_delayMode', form.delayMode.value);
      localStorage.setItem('draft_customDelay', form.customDelay.value);
      localStorage.setItem('draft_message', form.message.value);
    }

    function restoreDraft() {
      const form = document.getElementById('sendNowForm');
      if (localStorage.getItem('draft_account')) form.account.value = localStorage.getItem('draft_account');
      if (localStorage.getItem('draft_delayMode')) {
        form.delayMode.value = localStorage.getItem('draft_delayMode');
        document.getElementById('customDelayContainer').style.display = form.delayMode.value === 'custom' ? 'block' : 'none';
      }
      if (localStorage.getItem('draft_customDelay')) form.customDelay.value = localStorage.getItem('draft_customDelay');
      if (localStorage.getItem('draft_message')) form.message.value = localStorage.getItem('draft_message');
    }

    document.getElementById('sendNowForm').addEventListener('input', saveDraft);
    document.getElementById('sendNowForm').addEventListener('change', saveDraft);
    // -------------------------------

    (async () => {
      await renderNav('index.html');
      await loadAccountsDropdown();
      restoreDraft();
      await loadStats();
    })();
  </script>
</body>
</html>
