<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard - Boutique Broadcast</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav id="nav"></nav>
  <div class="mode-banner" id="mode-banner"></div>
  <main>
    <h1 data-i18n="home.heading">Overview</h1>
    <div class="stat-row" id="stats"></div>

    <div class="card" style="margin-top:20px;">
      <h2 data-i18n="home.send.heading">Send a message now</h2>
      <p class="muted" data-i18n="home.send.desc">Sends to every contact right away -- no draft, no review step. Use <code>{{name}}</code> to fill in each contact's own name automatically.</p>
      
      <form id="sendNowForm">
        <div style="margin-bottom: 16px;">
          <label for="accountSelect">Target Sending Account / Proxy</label>
          <select id="accountSelect" name="account" style="width: 100%; max-width: 400px;">
            <option value="all">All Active Accounts (Round-Robin)</option>
          </select>
        </div>

        <div style="margin-bottom: 16px;">
          <label for="delaySelect" style="font-weight: 600; display: block; margin-bottom: 4px;">Sending Speed / Delay Mode:</label>
          <select id="delaySelect" name="delayMode" style="width: 100%; max-width: 400px; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
            <option value="auto">Automatic (Fast - System Managed)</option>
            <option value="old_acc">Old Account Mode (2 to 5 min delay per msg)</option>
            <option value="moderate">Moderate Safe Mode (10 to 30 sec delay per msg)</option>
            <option value="custom">Custom Fixed Delay (seconds)</option>
          </select>
        </div>

        <div id="customDelayContainer" style="display: none; margin-bottom: 16px;">
          <label for="customDelayInput" style="font-weight: 600; display: block; margin-bottom: 4px;">Custom Delay (seconds):</label>
          <input type="number" id="customDelayInput" name="customDelay" min="1" max="600" value="120" style="width: 100%; max-width: 200px; padding: 8px;" />
        </div>

        <div style="margin-bottom: 16px;">
          <label for="mediaInput" style="font-weight: 600; display: block; margin-bottom: 4px;">Attach Image or Video (Optional):</label>
          <input type="file" id="mediaInput" name="media" accept="image/*,video/*" style="width: 100%; max-width: 400px;" />
        </div>

        <div style="margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between;">
          <label style="font-weight: 600;">Message Content (Multiple Variations):</label>
          <span class="muted" style="font-size: 12px;">Reduces ban risk</span>
        </div>
        <div id="msgTabs" style="display: flex; gap: 4px; margin-bottom: 8px;">
          <button type="button" class="secondary active-tab" data-idx="0" style="padding: 4px 12px; border-bottom-left-radius: 0; border-bottom-right-radius: 0; background: #2563eb; color: white;">Message 1</button>
          <button type="button" class="secondary" id="addMsgBtn" style="padding: 4px 12px; border-bottom-left-radius: 0; border-bottom-right-radius: 0;">+ Add</button>
        </div>
        <div id="msgContainers">
          <textarea name="message_0" id="message_0" required data-i18n-placeholder="home.send.placeholder" placeholder="Hi {{name}}, enjoy 20% off this week!" style="border-top-left-radius: 0;"></textarea>
        </div>
        <input type="hidden" name="message" id="finalMessagePayload" />
        <br />
        <button type="submit" data-i18n="home.send.button">Send to all contacts</button>
      </form>
      <div class="error" id="sendNowError"></div>
      <div class="muted" id="sendNowResult" style="margin-top: 10px;"></div>
      
      <div id="liveProcessContainer" style="display: none; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border);">
        <div id="liveProcessList"></div>
      </div>
    </div>
  </main>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
  <script>
    let globalContacts = [];
    let globalCampaigns = [];
    let globalAccounts = [];

    async function loadAccountsDropdown() {
      try {
        globalAccounts = await api('/accounts');
        const select = document.getElementById('accountSelect');
        select.innerHTML = '<option value="all">All Active Accounts (Round-Robin)</option>';
        globalAccounts.forEach((acc) => {
          const opt = document.createElement('option');
          opt.value = acc.id;
          opt.textContent = `${acc.account_name || acc.id} (${acc.status})`;
          select.appendChild(opt);
        });
      } catch (err) {
        console.warn('Failed to load accounts list', err);
      }
    }

    let globalCredits = 0;

    async function loadStats() {
      const [contacts, campaigns, creditsRes] = await Promise.all([
        api('/contacts'), 
        api('/campaigns'),
        api('/credits')
      ]);
      globalContacts = contacts;
      globalCampaigns = campaigns;
      globalCredits = creditsRes.balance || 0;
      updateMetricsDisplay();
      
      if (globalCampaigns.some(c => c.status === 'sending' || c.status === 'draft')) {
        startLiveMonitoring();
      }
    }

    function updateMetricsDisplay() {
      const selectedAccount = document.getElementById('accountSelect').value;
      let targetContacts = globalContacts;

      const totalContacts = targetContacts.length;
      const optedIn = targetContacts.filter((c) => c.opt_in_status === 'opted_in').length;
      const optedOut = targetContacts.filter((c) => c.opt_in_status === 'opted_out').length;

      let totalSentCount = 0;
      globalCampaigns.forEach((c) => {
        totalSentCount += (c.sent || 0) + (c.delivered || 0) + (c.read || 0);
      });

      const stats = [
        ['Available Credits', new Intl.NumberFormat().format(globalCredits)],
        [t('home.stat.contacts'), totalContacts],
        [t('home.stat.optedIn'), optedIn],
        [t('home.stat.optedOut'), optedOut],
        [t('home.stat.campaigns'), totalSentCount],
      ];

      document.getElementById('stats').innerHTML = stats
        .map(([label, n]) => `<div class="stat"><div class="n">${n}</div><div class="label">${label}</div></div>`)
        .join('');
    }

    document.getElementById('accountSelect').addEventListener('change', updateMetricsDisplay);

    document.getElementById('delaySelect').addEventListener('change', (e) => {
      const customContainer = document.getElementById('customDelayContainer');
      customContainer.style.display = e.target.value === 'custom' ? 'block' : 'none';
    });

    document.getElementById('sendNowForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const errorEl = document.getElementById('sendNowError');
      const resultEl = document.getElementById('sendNowResult');
      errorEl.textContent = '';
      resultEl.textContent = '';

      const optedIn = globalContacts.filter((c) => c.opt_in_status === 'opted_in').length;
      const selectedAccount = document.getElementById('accountSelect').value;
      const accountLabel = selectedAccount === 'all' ? 'All Active Accounts' : selectedAccount;
      const delayMode = form.delayMode.value;
      const customDelay = Number(form.customDelay.value || 120);

      // Compile message variations into spintax
      const messages = [];
      document.querySelectorAll('#msgContainers textarea').forEach(ta => {
        const val = ta.value.trim();
        if (val) messages.push(val);
      });
      if (messages.length === 0) {
        errorEl.textContent = "Please enter at least one message variation.";
        return;
      }
      // If 1 message, just use it. If multiple, wrap in {A|B|C} spintax.
      const finalPayload = messages.length === 1 ? messages[0] : `{${messages.join('|')}}`;
      document.getElementById('finalMessagePayload').value = finalPayload;

      if (!confirm(`${t('home.send.confirmPrefix')} ${optedIn} ${t('home.send.confirmSuffix')}\n(Using ${accountLabel}, Delay: ${delayMode})`)) return;

      const btn = form.querySelector('button[type="submit"]');
      const originalLabel = btn.textContent;
      btn.disabled = true;
      btn.textContent = t('home.send.sending');
      try {
        const formData = new FormData();
        formData.append('message', finalPayload);
        formData.append('accountId', selectedAccount);
        formData.append('delayMode', delayMode);
        formData.append('customDelay', customDelay);
        if (form.media.files[0]) {
          formData.append('media', form.media.files[0]);
        }

        const response = await api('/campaigns/send-now', {
          method: 'POST',
          body: formData
        });
        
        if (response.started) {
          resultEl.innerHTML = `<span style="color: #10b981; font-weight: bold;">✔ Broadcast started successfully!</span> Scroll down to monitor live progress.`;
          document.querySelectorAll('#msgContainers textarea').forEach(ta => ta.value = '');
          saveDraft(); // clear drafts
          startLiveMonitoring();
        }
      } catch (err) {
        errorEl.textContent = err.message;
      }
      btn.disabled = false;
      btn.textContent = originalLabel;
    });

    // --- Live Process Monitoring ---
    let liveMonitorInterval = null;
    function startLiveMonitoring() {
      if (liveMonitorInterval) return;
      document.getElementById('liveProcessContainer').style.display = 'block';
      pollLiveProcess();
      liveMonitorInterval = setInterval(pollLiveProcess, 3000);
    }

    async function pollLiveProcess() {
      try {
        const campaigns = await api('/campaigns');
        const active = campaigns.filter(c => c.status === 'sending' || c.status === 'draft');
        const recent = campaigns.filter(c => c.status === 'completed' || c.status === 'failed').slice(0, 3);
        
        const renderCampaign = (c) => `
          <div style="background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 8px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
              <strong>${escapeHtml(c.name)}</strong>
              <div style="display: flex; align-items: center; gap: 8px;">
                ${c.status === 'sending' ? `<button onclick="stopCampaign(${c.id})" style="padding: 2px 8px; font-size: 11px; background: #ef4444; color: white; border-radius: 4px; border: none; cursor: pointer;">Stop</button>` : ''}
                <button onclick="viewLogs(${c.id})" style="padding: 2px 8px; font-size: 11px; background: #64748b; color: white; border-radius: 4px; border: none; cursor: pointer;">Logs</button>
                <span class="badge ${c.status === 'sending' ? 'CONNECTING' : c.status === 'completed' ? 'READY' : 'BANNED'}">${c.status.toUpperCase()}</span>
              </div>
            </div>
            <div style="display: flex; gap: 16px; font-size: 13px;">
              <span style="color: #2563eb;">Targeted: <b>${c.totalTargeted || 0}</b></span>
              <span style="color: #10b981;">Sent: <b>${c.sent || 0}</b></span>
              <span style="color: #ef4444;">Failed: <b>${c.failed || 0}</b></span>
            </div>
            ${c.status === 'sending' ? `
              <div style="margin-top: 10px; background: #e2e8f0; border-radius: 4px; height: 6px; overflow: hidden;">
                <div style="background: #2563eb; height: 100%; width: ${Math.min(100, ((c.sent || 0) + (c.failed || 0)) / Math.max(1, (c.totalTargeted || 1)) * 100)}%;"></div>
              </div>
            ` : ''}
          </div>
        `;

        let html = '';
        if (active.length > 0) {
          html += `<h3 style="margin: 0 0 10px 0; font-size: 14px; color: #2563eb;">📡 Active Broadcasts</h3>`;
          html += active.map(renderCampaign).join('');
        }
        if (recent.length > 0) {
          html += `<h3 style="margin: 16px 0 10px 0; font-size: 14px; color: var(--muted);">Recent History</h3>`;
          html += recent.map(renderCampaign).join('');
        }
        
        if (html === '') {
          html = `<p class="muted">No broadcasts found.</p>`;
        }
        
        document.getElementById('liveProcessList').innerHTML = html;
        await loadStats(); // silently update global stats too
      } catch (e) {
        console.error('Live monitor error', e);
      }
    }

    async function stopCampaign(id) {
      if (!confirm('Are you sure you want to completely stop this broadcast?')) return;
      try {
        await api('/campaigns/' + id + '/stop', { method: 'POST' });
        pollLiveProcess(); // refresh instantly
      } catch (err) {
        alert(err.message);
      }
    }

    async function viewLogs(id) {
      document.getElementById('logsModal').style.display = 'flex';
      const container = document.getElementById('logsContent');
      container.innerHTML = 'Loading logs...';
      try {
        const recipients = await api('/campaigns/' + id + '/recipients');
        const failed = recipients.filter(r => r.status === 'failed');
        if (failed.length === 0) {
          container.innerHTML = '<p class="muted">No failed messages in this campaign.</p>';
          return;
        }
        let html = '<table style="width:100%; border-collapse:collapse; font-size:12px;">';
        html += '<tr><th style="padding:4px;border-bottom:1px solid var(--border);">Phone</th><th style="padding:4px;border-bottom:1px solid var(--border);">Error Reason</th><th style="padding:4px;border-bottom:1px solid var(--border);">Time</th></tr>';
        failed.forEach(r => {
          html += `<tr>
            <td style="padding:4px;border-bottom:1px solid var(--border);">${escapeHtml(r.phone)}</td>
            <td style="padding:4px;border-bottom:1px solid var(--border);color:var(--danger);">${escapeHtml(r.error || 'Unknown')}</td>
            <td style="padding:4px;border-bottom:1px solid var(--border);">${r.sent_at ? new Date(r.sent_at).toLocaleTimeString() : 'N/A'}</td>
          </tr>`;
        });
        html += '</table>';
        container.innerHTML = html;
      } catch (err) {
        container.innerHTML = `<span style="color:var(--danger)">Error loading logs: ${err.message}</span>`;
      }
    }

    // --- Message Tabs Logic ---
    let nextMsgId = 1;
    let activeMsg = 0;

    function switchTab(idx) {
      if (!document.getElementById(`message_${idx}`)) return;
      activeMsg = idx;
      document.querySelectorAll('.active-tab').forEach(el => el.classList.remove('active-tab', 'btn-primary'));
      document.querySelectorAll('#msgTabs button[data-idx]').forEach(el => {
        if (parseInt(el.dataset.idx) === idx) {
          el.classList.add('active-tab');
          el.style.background = '#2563eb';
          el.style.color = 'white';
        } else {
          el.style.background = '';
          el.style.color = '';
        }
      });
      document.querySelectorAll('#msgContainers textarea').forEach(el => el.style.display = 'none');
      document.getElementById(`message_${idx}`).style.display = 'block';
      localStorage.setItem('draft_activeMsg', idx);
    }

    document.getElementById('msgTabs').addEventListener('click', (e) => {
      const target = e.target;
      if (target.classList.contains('del-tab')) {
        const idx = parseInt(target.parentElement.dataset.idx);
        target.parentElement.remove();
        const ta = document.getElementById(`message_${idx}`);
        if (ta) ta.remove();
        if (activeMsg === idx) switchTab(0);
        saveDraft();
        return;
      }
      if (target.dataset.idx !== undefined) switchTab(parseInt(target.dataset.idx));
    });

    function addMessageTab(initialVal = '') {
      const currentCount = document.querySelectorAll('#msgContainers textarea').length;
      if (currentCount >= 5) return null;
      const idx = nextMsgId++;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'secondary';
      btn.dataset.idx = idx;
      btn.style = 'padding: 4px 12px; border-bottom-left-radius: 0; border-bottom-right-radius: 0; display: flex; align-items: center; gap: 6px;';
      btn.innerHTML = `Msg ${idx + 1} <span class="del-tab" style="color: #ef4444; cursor: pointer; font-weight: bold;">&times;</span>`;
      document.getElementById('addMsgBtn').before(btn);

      const ta = document.createElement('textarea');
      ta.name = `message_${idx}`;
      ta.id = `message_${idx}`;
      ta.placeholder = "Another variation of your message...";
      ta.style = 'border-top-left-radius: 0; display: none;';
      ta.value = initialVal;
      document.getElementById('msgContainers').appendChild(ta);
      return idx;
    }

    document.getElementById('addMsgBtn').addEventListener('click', () => {
      if (document.querySelectorAll('#msgContainers textarea').length >= 5) return alert("Maximum 5 message variations allowed.");
      const idx = addMessageTab('');
      if (idx !== null) {
        switchTab(idx);
        saveDraft();
      }
    });

    // --- Draft Persistence Logic ---
    function saveDraft() {
      const form = document.getElementById('sendNowForm');
      if (!form) return;
      if (form.account) localStorage.setItem('draft_account', form.account.value);
      if (form.delayMode) localStorage.setItem('draft_delayMode', form.delayMode.value);
      if (form.customDelay) localStorage.setItem('draft_customDelay', form.customDelay.value);
      
      const textareas = document.querySelectorAll('#msgContainers textarea');
      localStorage.setItem('draft_msgCount', textareas.length);
      textareas.forEach((ta, i) => {
        localStorage.setItem(`draft_message_${i}`, ta.value);
      });
      localStorage.setItem('draft_activeMsg', activeMsg);
    }

    function restoreDraft() {
      const form = document.getElementById('sendNowForm');
      if (!form) return;
      if (localStorage.getItem('draft_account') && form.account) form.account.value = localStorage.getItem('draft_account');
      if (localStorage.getItem('draft_delayMode') && form.delayMode) {
        form.delayMode.value = localStorage.getItem('draft_delayMode');
        document.getElementById('customDelayContainer').style.display = form.delayMode.value === 'custom' ? 'block' : 'none';
      }
      if (localStorage.getItem('draft_customDelay') && form.customDelay) form.customDelay.value = localStorage.getItem('draft_customDelay');
      
      const savedCount = parseInt(localStorage.getItem('draft_msgCount') || '1');
      // Read all saved values FIRST before any DOM manipulation
      const savedValues = [];
      for (let i = 0; i < savedCount; i++) {
        savedValues.push(localStorage.getItem(`draft_message_${i}`) || '');
      }

      // Restore first message
      const firstTa = document.getElementById('message_0');
      if (firstTa && savedValues[0] !== undefined) {
        firstTa.value = savedValues[0];
      }

      // Add remaining message tabs with their restored text WITHOUT triggering saveDraft
      for (let i = 1; i < savedCount; i++) {
        addMessageTab(savedValues[i]);
      }
      
      const savedActive = parseInt(localStorage.getItem('draft_activeMsg') || '0');
      switchTab(savedActive || 0);
    }

    document.getElementById('sendNowForm').addEventListener('input', saveDraft);
    document.getElementById('sendNowForm').addEventListener('change', saveDraft);
    window.addEventListener('beforeunload', saveDraft);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') saveDraft();
    });
    // -------------------------------

    (async () => {
      await renderNav('index.html');
      await loadAccountsDropdown();
      restoreDraft();
      await loadStats();
    })();
  </script>

  <!-- Logs Modal -->
  <div class="modal-backdrop" id="logsModal" style="display: none;">
    <div class="modal">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2 style="margin: 0; font-size: 16px;">Campaign Logs</h2>
        <button onclick="document.getElementById('logsModal').style.display = 'none'" style="background: none; border: none; font-size: 20px; cursor: pointer; color: var(--muted); padding: 0;">&times;</button>
      </div>
      <div id="logsContent"></div>
    </div>
  </div>
</body>
</html>
