<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Campaign detail - Boutique Broadcast</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav id="nav"></nav>
  <div class="mode-banner" id="mode-banner"></div>
  <main>
    <p><a class="link" href="campaigns.html">&larr; Back to campaigns</a></p>
    <h1 id="title">Campaign</h1>
    <div class="card">
      <table>
        <thead><tr><th>Phone</th><th>Name</th><th>Status</th><th>Sent at</th><th>Error</th></tr></thead>
        <tbody id="recipientsBody"></tbody>
      </table>
    </div>
  </main>
  <script src="app.js"></script>
  <script>
    (async () => {
      await renderNav('campaigns.html');
      const id = new URLSearchParams(window.location.search).get('id');
      const [campaign, recipients] = await Promise.all([api(`/campaigns/${id}`), api(`/campaigns/${id}/recipients`)]);
      document.getElementById('title').textContent = `Campaign: ${campaign.name}`;
      document.getElementById('recipientsBody').innerHTML = recipients
        .map(
          (r) => `<tr>
            <td>${escapeHtml(r.phone)}</td>
            <td>${escapeHtml(r.name || '')}</td>
            <td><span class="badge ${r.status}">${r.status}</span></td>
            <td class="muted">${escapeHtml(r.sent_at || '')}</td>
            <td class="error">${escapeHtml(r.error || '')}</td>
          </tr>`
        )
        .join('');
    })();
  </script>
</body>
</html>
