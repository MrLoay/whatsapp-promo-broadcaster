<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WhatsApp - Boutique Broadcast</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    #qrBox { text-align: center; padding: 20px; }
    #qrBox img { max-width: 280px; width: 100%; border: 8px solid white; border-radius: 8px; }
    .status-line { font-size: 15px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <nav id="nav"></nav>
  <div class="mode-banner" id="mode-banner"></div>
  <main>
    <h1 data-i18n="whatsapp.heading">WhatsApp connection</h1>
    <div class="card">
      <div class="status-line" id="statusLine" data-i18n="whatsapp.checking">Checking...</div>
      <div id="needsLiveMode" style="display:none;" class="muted" data-i18n="whatsapp.needsLive">
        Test mode is currently on. Turn it off to connect a real WhatsApp account, then reload this page.
      </div>
      <div id="connectArea" style="display:none;">
        <button id="connectBtn" data-i18n="whatsapp.connectButton">Connect WhatsApp</button>
      </div>
      <div id="qrBox" style="display:none;">
        <p data-i18n="whatsapp.scanInstructions">Scan this with WhatsApp on your phone: Settings &gt; Linked Devices &gt; Link a Device</p>
        <img id="qrImg" src="" alt="WhatsApp QR code" /><br /><br />
        <button id="cancelBtn" class="secondary" data-i18n="whatsapp.cancel">Cancel</button>
      </div>
      <div id="readyBox" style="display:none;">
        <p style="color: var(--success); font-weight: 600;" data-i18n="whatsapp.connected">Connected. You can send messages now.</p>
        <button id="disconnectBtn" class="danger" data-i18n="whatsapp.disconnect">Disconnect</button>
      </div>
      <div id="errorBox" class="error"></div>
    </div>
  </main>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
  <script>
    let polling = null;

    function show(id) {
      ['connectArea', 'qrBox', 'readyBox', 'needsLiveMode'].forEach(
        (i) => (document.getElementById(i).style.display = i === id ? 'block' : 'none')
      );
    }

    async function poll() {
      const state = await api('/whatsapp/status');
      const statusLine = document.getElementById('statusLine');
      const errorBox = document.getElementById('errorBox');
      errorBox.textContent = state.error || '';

      const health = await fetch('/health').then((r) => r.json());
      if (health.dryRun) {
        statusLine.textContent = `${t('whatsapp.statusPrefix')} ${t('whatsapp.statusDryRun')}`;
        show('needsLiveMode');
        clearInterval(polling);
        return;
      }

      statusLine.textContent = `${t('whatsapp.statusPrefix')} ${state.status}`;
      if (state.status === 'ready') {
        show('readyBox');
      } else if (state.status === 'qr' && state.qrDataUrl) {
        document.getElementById('qrImg').src = state.qrDataUrl;
        show('qrBox');
      } else {
        show('connectArea');
      }
    }

    document.getElementById('connectBtn').addEventListener('click', async () => {
      try {
        await api('/whatsapp/connect', { method: 'POST' });
      } catch (err) {
        document.getElementById('errorBox').textContent = err.message;
      }
    });

    async function disconnect() {
      if (!confirm(t('whatsapp.disconnectConfirm'))) return;
      try {
        await api('/whatsapp/disconnect', { method: 'POST' });
        await poll();
      } catch (err) {
        document.getElementById('errorBox').textContent = err.message;
      }
    }
    document.getElementById('disconnectBtn').addEventListener('click', disconnect);
    document.getElementById('cancelBtn').addEventListener('click', disconnect);

    (async () => {
      await renderNav('whatsapp.html');
      await poll();
      polling = setInterval(poll, 2000);
    })();
  </script>
</body>
</html>
